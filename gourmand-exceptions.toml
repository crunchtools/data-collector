# Gourmand Exceptions
# Documented exceptions for files that legitimately trigger checks

[[exceptions]]
check = "CH001-absolute_paths"
path = "deploy/**"
classification = "by_design"
justification = "deploy/ holds the systemd units and the env example as they are installed on a host. The /srv/<service>/ paths are the constitution's config placement rule (XIV), not an accident: a relative path would not resolve for systemd or for the operator copying the file."

[[exceptions]]
check = "hidden_env_config"
path = "src/data_collector/__main__.py"
classification = "by_design"
justification = "The container's only configuration surface is its environment (constitution XIV: config is bind-mounted from the host, here as an env file). Every variable read is listed in this module's docstring, in deploy/collector.env.example and in docs/judging.md; none is hidden. QUARANTINE_MODEL is Trentina's own setting, which the parent process sets for each judge model's child."
