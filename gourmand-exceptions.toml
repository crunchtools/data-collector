# Gourmand Exceptions
# Documented exceptions for files that legitimately trigger checks

[[exceptions]]
check = "CH001-absolute_paths"
path = "deploy/**"
classification = "by_design"
justification = "deploy/ holds the systemd units and the env example as they are installed on a host. The host paths in them are the constitution's config placement rule (XIV), not an accident: a relative path would not resolve for systemd or for the operator copying the file."

[[exceptions]]
check = "hidden_env_config"
path = "src/data_collector/__main__.py"
classification = "by_design"
justification = "The container's only configuration surface is its environment (constitution XIV: config is bind-mounted from the host, here as an env file). Every variable read is listed in this module's docstring, in deploy/collector.env.example and in docs/evaluating.md; none is hidden. QUARANTINE_MODEL is Trentina's own setting, which the parent process sets for each judge model's child."

[[exceptions]]
check = "manifest_lint_suppression"
path = "pyproject.toml"
classification = "by_design"
justification = "One entry: S101 (use of assert) for tests/ only. pytest tests are assert statements; the rule stays on for src/, where an assert would be a real finding."

[[exceptions]]
check = "hidden_env_config"
path = "src/data_collector/label.py"
classification = "by_design"
justification = "Labelling's only configuration surface is its environment (constitution XIV), as for the collector. Every variable read is listed in this module's docstring and in deploy/labeller.env.example; none is hidden."

# Ruff is not missing; it moved. Gourmand's IF001 looks for a literal
# `ruff-check` hook id, and under python-sdlc (constitution XII, v1.30.0) ruff
# runs inside the `sdlc-commit` hook, configured by [tool.ruff] in
# pyproject.toml. Same precedent as trentina.
[[exceptions]]
check = "linter_configuration"
path = ".pre-commit-config.yaml"
pattern = "ruff-check"
justification = "ruff runs inside the sdlc-commit hook from python-sdlc (constitution XII v1.30.0), configured by [tool.ruff] in pyproject.toml; Gourmand looks for a literal ruff hook id"
classification = "by_design"
