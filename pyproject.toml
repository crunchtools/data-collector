[project]
name = "data-collector"
version = "0.6.0"
description = "Collects documents from hostile feeds and records what Trentina's defense pipeline makes of each"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
# httpx is all the collector needs of its own, and the Trentina image it is
# built on already carries it. The image installs nothing from here: the
# package directory is copied in (see Containerfile).
dependencies = ["httpx>=0.27"]

[dependency-groups]
dev = ["mypy>=1.13", "pytest>=8", "pytest-asyncio>=1.5.0", "ruff>=0.17.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_collector"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "S", "B", "C4", "C901", "DTZ", "ISC", "PIE", "PT", "RET", "SIM", "TCH", "ARG", "PLE", "PLW", "RUF"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# S101: pytest's assert. S608: no SQL is built from input anywhere; the tests
# read fixed tables back.
"tests/*" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src"]

# Trentina is distributed as a container image only: it is importable inside
# the image this one is built on, and nowhere a type checker runs.
[[tool.mypy.overrides]]
module = "trentina.*"
ignore_missing_imports = true

# The boot gate: the two `podman run` lines boot-command used to run, run inside
# the image this PR builds. sdlc 0.15 does not enforce
# `[tool.sdlc.image] boot = "command"` (crunchtools/sdlc#118). The image has no
# shell, so each is its own argv, with the original's environment. The original
# also ran with --read-only; a `command` container's root filesystem is
# writable (only /repo is read-only, /tmp is a tmpfs), so that is not checked.
[tool.sdlc.ci]
checks = ["data-collector-image", "boot-gate", "boot-gate-label"]

[tool.sdlc.ci.data-collector-image]
kind = "image-build"

[tool.sdlc.ci.boot-gate]
kind = "command"
image = "localhost/data-collector:sdlc"
argv = ["python", "-m", "data_collector", "check"]
env = { OPENROUTER_API_KEY = "not-a-key" }

[tool.sdlc.ci.boot-gate-label]
kind = "command"
image = "localhost/data-collector:sdlc"
argv = ["python", "-m", "data_collector", "check-label"]
env = { HOME = "/tmp/home" }

[tool.sdlc.push]
# No in-repo Semgrep rules: the check exits 2 when .semgrep is absent rather
# than scanning nothing and calling it a pass.
skip = ["semgrep"]

[tool.sdlc]
repo-kinds = ["container-image"]

[tool.sdlc.image]
# Written by crunchtools/sdlc's scripts/convert_repo.py: moved from the workflows.
image = "quay.io/crunchtools/data-collector"
# No HEALTHCHECK, and the container is a one-shot collector: the boot gate is the
# [tool.sdlc.ci] boot-gate and boot-gate-label checks against this PR's built image.
boot = "none"
boot-none-reason = "no HEALTHCHECK and no server to hold open; the boot gate is the [tool.sdlc.ci] boot-gate and boot-gate-label checks against this PR's built image"
