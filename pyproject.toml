[project]
name = "data-collector"
version = "0.2.0"
description = "Collects documents from hostile feeds and records what Trentina's defense pipeline makes of each"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
# httpx is all the collector needs of its own, and the Trentina image it is
# built on already carries it. The image installs nothing from here: the
# package directory is copied in (see Containerfile).
dependencies = ["httpx>=0.27"]

[dependency-groups]
dev = ["mypy>=1.13", "pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_collector"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "S", "B", "C4", "C901", "DTZ", "ISC", "PIE", "PT", "RET", "SIM", "TCH", "ARG", "PLE", "PLW", "RUF"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# S101: pytest's assert. S608: no SQL is built from input anywhere; the tests
# read fixed tables back.
"tests/*" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src"]

# Trentina is distributed as a container image only: it is importable inside
# the image this one is built on, and nowhere a type checker runs.
[[tool.mypy.overrides]]
module = "trentina.*"
ignore_missing_imports = true
